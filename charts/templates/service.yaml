apiVersion: v1
kind: Service
metadata:
  name: jenkins
  annotations:
    external-dns.alpha.kubernetes.io/hostname: jenkins.aws.dev.e-comm
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:eu-west-1:905418412961:certificate/cea51297-afa5-4ec2-b57e-e06e10012d54
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
  labels:
    app: jenkins
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: jenkins
